name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned image: a new runner image (and Chrome) only arrives when this line changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Show browser version
        run: google-chrome --version

      - name: Run tests
        run: uv run pytest

      # always(): the report and screenshots matter most when a test fails.
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14
