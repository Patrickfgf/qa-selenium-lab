name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned image: a new runner image (and Chrome) only arrives when this line changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Show browser version
        run: google-chrome --version

      - name: Run tests
        run: uv run pytest

      # always(): the report and screenshots matter most when a test fails.
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14
